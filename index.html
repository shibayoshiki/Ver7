0px;font-size:12px;color:#304b71;text-align:left}.account b{display:block}.account code{font-size:11px;overflow-wrap:anywhere}.lang-gate{position:fixed;inset:0;z-index:40;background:#101c34c4;display:grid;place-items:center;padding:18px}.lang-panel{background:white;border-radius:20px;padding:28px;width:min(480px,100%);box-shadow:0 30px 90px #0003}.lang-opt{border:1px solid #b9cdee;background:#f1f6ff;color:#1d407a;border-radius:12px;padding:18px;flex:1;text-align:left}.lang-opt b{display:block;font-size:20px}.lang-opt small{display:block}.hidden{display:none!important}#appNotice{margin:0 0 13px}.section-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:13px}.section-top h2{margin:0}.featurehead{display:flex;justify-content:space-between;gap:10px;align-items:start}.checkcard{border:1px solid var(--line);border-left:4px solid #a7b2c4;background:#fff;border-radius:12px;padding:14px}.checkcard.warn{border-left-color:#e0aa4e}.checkcard.good{border-left-color:#5aae8b}.checkcard h3{margin:0 0 5px}.checkcard p{font-size:13px;margin:5px 0}.teacher{display:grid;gap:7px}.teacher p{font-size:13px;color:#4f6079;margin:0}.progress{height:7px;background:#e2eaf4;border-radius:99px;overflow:hidden}.progress>i{display:block;background:#6497e8;height:100%}.statuslabel{font-size:11px;color:#44638c;background:#edf4ff;border-radius:20px;padding:4px 8px}.formrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.footer{color:#8a98a9;text-align:center;font-size:11px;margin-top:30px}.nowrap{white-space:nowrap}.preline{white-space:pre-wrap;overflow-wrap:anywhere}.boxtext{background:#f6f9fe;border:1px solid #e1e9f4;border-radius:10px;padding:10px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}.suggestion{font-size:12px;color:#485a73;margin-top:8px}.is-compact .dash-grid{grid-template-columns:1fr}.is-compact .dashstat:nth-child(n+2){display:none}

<script>
'use strict';
/* 進路コンパス Ver.7.0 統合デモ: 無料・外部AI/API送信なし / 実データ登録禁止 */
const KEY='compass_v70_local_demo', LANGKEY='compass_v70_language';
const ACCOUNTS=[
 {id:'student-demo',pass:'student123',role:'student',school:'a',name:'生徒A（架空）',homeroom:'t1'},
 {id:'student-b',pass:'student123',role:'student',school:'a',name:'生徒B（架空）',homeroom:'t2'},
 {id:'student-c',pass:'student123',role:'student',school:'b',name:'生徒C（架空）',homeroom:'t4'},
 {id:'teacher-demo',pass:'teacher123',role:'teacher',school:'a',name:'A先生（架空）',teacherId:'t1'},
 {id:'teacher-b',pass:'teacher123',role:'teacher',school:'a',name:'B先生（架空）',teacherId:'t2'},
 {id:'teacher-c',pass:'teacher123',role:'teacher',school:'b',name:'D先生（架空）',teacherId:'t4'},
 {id:'admin-demo',pass:'admin123',role:'admin',school:'a',name:'管理者A（架空）'},
 {id:'admin-b',pass:'admin123',role:'admin',school:'b',name:'管理者B（架空）'}
];
const SEEDTEACHERS={
 a:[{id:'t1',name:'A先生（架空）',subject:'国語・進路指導',keywords:'志望理由書 文章 日本語 総合型 進路',bio:'文章構成や大学志望理由の整理を支援します。',status:'open',approved:true},{id:'t2',name:'B先生（架空）',subject:'英語',keywords:'英語 国際 国際関係 留学 英文 面接',bio:'英語での面接や国際分野の相談を担当します。',status:'open',approved:true},{id:'t3',name:'C先生（架空）',subject:'芸術・表現',keywords:'芸術 演劇 声優 表現 映画 音楽 デザイン',bio:'芸術・表現分野に関する進路相談に対応します。',status:'open',approved:true}],
 b:[{id:'t4',name:'D先生（架空）',subject:'理科',keywords:'理科 研究 科学 生物 医療',bio:'理系学問への志望理由や調査活動の相談を担当します。',status:'open',approved:true}]
};
function freshDb(){return {version:7,users:{},schools:{a:{teachers:structuredClone(SEEDTEACHERS.a),requests:[],updates:[],feedback:[]},b:{teachers:structuredClone(SEEDTEACHERS.b),requests:[],updates:[],feedback:[]}}};}
function loadDb(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.users&&x.schools&&x.version===7)return x;}catch{}return freshDb();}
let db=loadDb(), who=null, page='home', lang='ja', gate=false, editActivityId=null, selectedVersionIds=[], lastChecks=[], searchText='', teacherFilter='', currentNotice='', dashboardVisible=true;
try{const saved=localStorage.getItem(LANGKEY);if(saved==='ja'||saved==='en'){lang=saved;gate=true;}}catch{}
const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>String(Date.now())+'-'+Math.random().toString(36).slice(2,9);
const today=()=>new Date().toISOString().slice(0,10);
const school=()=>db.schools[who.school];
const isEn=()=>lang==='en'&&who&&who.role!=='student';
const tx=(ja,en)=>isEn()?(en||ja):ja;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));return true;}catch{alert('保存容量またはブラウザ設定のため保存できませんでした。');return false;}}
function newUser(){return {profile:{nickname:'',university:'',topic:'',deadline:'',method:'総合型選抜'},activities:[],documents:[],draft:{type:'志望理由書',aim:'',text:''},runs:{},tasks:[],applications:[],analysis:null,settings:{dashboard:true,compact:false},lastChecks:[]};}
function userData(){if(!db.users[who.id]){db.users[who.id]=newUser();persist();}return db.users[who.id];}
function safeDay(s){if(!/^\d{4}-\d\d-\d\d$/.test(String(s)))return '';let d=new Date(s+'T12:00:00');return Number.isFinite(d.getTime())?new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'short',day:'numeric'}).format(d):'';}
function dayUntil(s){if(!s)return null;let d=new Date(s+'T00:00:00'),n=new Date();n.setHours(0,0,0,0);if(Number.isNaN(d.getTime()))return null;return Math.round((d-n)/86400000);}
function notify(msg){currentNotice=msg;render();}
function navItems(){let common=[['home','⌂',tx('ホーム','Home')]];
 if(who.role==='student')return common.concat([['journal','▤','活動エピソード'],['documents','▣','AI書類添削'],['factcheck','✓','事実確認'],['selfanalysis','◇','自己分析'],['teachers','◎','教員検索'],['interview','♧','面接対策'],['applications','▦','出願管理'],['history','◷','書類履歴'],['resources','⌕','大学・文献検索'],['activities','✦','活動提案'],['profile','☷','プロフィール'],['settings','⚙','設定']]);
 if(who.role==='teacher')return common.concat([['teacherportal','☷',tx('先生マイページ','Teacher portal')],['teachers','◎',tx('教員検索','Teacher directory')],['settings','⚙',tx('設定','Settings')]]);
 return common.concat([['admin','☷',tx('管理画面','Administration')],['teachers','◎',tx('教員一覧','Staff directory')],['settings','⚙',tx('設定','Settings')]]);
}
function root(){return $('root');}
function loginView(){return `<main class="login"><div class="login-panel stack">
 <div class="row"><span class="mark">進</span><div><strong style="font-size:20px">進路コンパス</strong><div class="muted small">Ver.7.0 / School admissions support prototype</div></div></div>
 <div class="warning">${lang==='en'?'Demo only: accounts and passwords are public. No real authentication, server access control, or cross-device sync. Do not enter actual student information.':'架空データ専用デモです。下記のID・パスワードは公開されており、本物の認証・権限制御ではありません。実名・本物の出願書類を入力しないでください。'}</div>
 <div class="row spread"><h1 style="margin:0">${lang==='en'?'Sign in / ログイン':'ログイン'}</h1><select id="loginLang" aria-label="Language"><option value="ja" ${lang==='ja'?'selected':''}>日本語</option><option value="en" ${lang==='en'?'selected':''}>English</option></select></div>
 <form id="loginForm" class="login-form"><label class="field">${lang==='en'?'Demo account ID':'デモID'}<input required id="loginId" autocomplete="off" placeholder="student-demo"></label><label class="field">${lang==='en'?'Password':'パスワード'}<input required id="loginPass" type="password" autocomplete="off" placeholder="student123"></label><div class="error hidden" id="loginError" role="alert"></div><button type="submit" class="button">${lang==='en'?'Sign in':'ログインする'}</button></form>
 <h3 style="margin:0">${lang==='en'?'Sample accounts':'試用アカウント（すべて架空）'}</h3><div class="account-grid">${ACCOUNTS.map(a=>`<button type="button" class="account" data-act="fill-login" data-id="${esc(a.id)}"><b>${esc(a.name)}・${esc(a.role)}</b><code>${esc(a.id)} / ${esc(a.pass)}</code></button>`).join('')}</div>
 <p class="notice" style="margin:0">学校A・学校Bと複数生徒のデモデータを分離して表示します。ただし保存先は同じブラウザで、セキュリティ上の隔離ではありません。</p>
 </div></main>`;}
function gateView(){return `<div class="lang-gate" role="dialog" aria-modal="true" aria-label="Language selection"><div class="lang-panel stack"><span class="tag">進路コンパス / PATHWAY COMPASS</span><h2 style="font-size:24px;margin:0">表示言語を選択してください<br><span class="muted" style="font-size:18px">Choose your language</span></h2><p class="small muted">英語は主に先生・管理者用画面で対応しています。<br>English support prioritizes teacher and admin interfaces.</p><div class="row" style="align-items:stretch"><button class="lang-opt" data-act="lang-pick" data-lang="ja"><b>日本語</b><small>生徒・教員向け</small></button><button class="lang-opt" data-act="lang-pick" data-lang="en"><b>English</b><small>Teacher interface</small></button></div></div></div>`;}
function shellView(){const menu=navItems();if(!menu.some(n=>n[0]===page))page='home';return `<div class="shell"><aside class="sidebar"><div class="logo"><span class="mark">進</span><div><strong>進路コンパス</strong><small>Ver.7.0 統合機能デモ</small></div></div><nav class="menu" aria-label="Main navigation">${menu.map(([id,icon,label])=>`<button type="button" class="navbtn ${page===id?'active':''}" data-go="${id}"><span class="symbol">${icon}</span>${esc(label)}</button>`).join('')}</nav><div class="sidefoot">架空の学校・アカウントでの操作検証用です。APIや学校システムには接続されません。</div></aside>
 <main class="main"><div class="topbar"><span class="tag">${tx('機能検証版・実データ入力禁止','Prototype · Fictional data only')}</span><div class="tools"><span class="small muted">${esc(who.name)} ｜ ${who.school==='a'?'学校A':'学校B'}</span><select id="appLang" aria-label="Language"><option value="ja" ${lang==='ja'?'selected':''}>日本語</option><option value="en" ${lang==='en'?'selected':''}>English</option></select><button class="button ghost sm" data-act="logout">${tx('ログアウト','Sign out')}</button></div></div><div class="warning" style="margin-bottom:16px">${tx('試作版のため、個人情報・実際の出願書類は入力しないでください。データ保存はブラウザ内のみです。','Prototype: never enter real student data or applications. All data remains in this browser.')}</div>${currentNotice?`<div id="appNotice" class="success">${esc(currentNotice)}</div>`:''}<div id="view">${view()}</div><p class="footer">進路コンパス Ver.7.0 / 機能確認用・学校導入前の試作品</p></main></div>`;}

function heading(title,desc){return `<header class="heading"><h1>${esc(title)}</h1><p>${esc(desc)}</p></header>`;}
function studentHome(){let u=userData(),p=u.profile,deadline=p.deadline||u.applications.filter(a=>a.deadline).sort((a,b)=>a.deadline.localeCompare(b.deadline))[0]?.deadline;let days=dayUntil(deadline);let drafts=u.documents.length;let lastrun=u.runs[p.type||'志望理由書']||0;let next=days!==null&&days<14?'出願締切・提出書類を確認しましょう':(lastrun>=3?'先生から直接、書類の添削を受けてみましょう':u.activities.length?'活動の振り返りを使って自己分析を進めましょう':'まず活動エピソードを1件登録しましょう');

function qualityCheck(text){let notes=[];if(text.length<130)notes.push({title:'説明の具体性',why:'文章が短く、経験から学びまでの説明が不足する可能性があります。',suggest:'取り組んだ行動・結果・学んだことを具体的に記載してください。'});
 if(!/(なぜ|理由|きっかけ|興味|関心|志望|学びたい)/.test(text))notes.push({title:'志望動機の明確さ',why:'目的や志望理由を示す表現が見つかりませんでした。',suggest:'その分野を学びたい理由と、経験とのつながりを確認しましょう。'});
 if(!/(学び|気づ|成長|改善|課題|振り返|反省)/.test(text))notes.push({title:'経験からの学び',why:'経験をどう受け止めたかが読み取りづらい可能性があります。',suggest:'経験を通じた変化や次の行動を自分の言葉で記しましょう。'});
 if(/(とても|すごく|頑張りました|色々|様々なこと)/.test(text))notes.push({title:'抽象的な表現',why:'抽象的な言葉だけでは行動が伝わりにくい場合があります。',suggest:'人数や成果を創作せず、実際に行った工夫や場面を一つ示してください。'});
 if(!notes.length)notes.push({title:'構成を第三者にも確認',why:'簡易ルールでは目立つ不足が検出されませんでした。ただし完成度を保証しません。',suggest:'先生に読んでもらい、説得力や本人らしさを確認してもらいましょう。'});
 return notes;}
function factChecks(text,u){let issues=[],mentioned=[];
 for(let a of u.activities){if(a.title&&text.includes(a.title)){mentioned.push(a); if(/(統括|全体の責任者|すべてを主導|リーダーとして主導)/.test(text)&&!/(責任者|統括|主導|リーダー)/.test(a.role+' '+a.action)){issues.push({type:'誇張の可能性',activity:a.id,title:'役割の表現を確認',why:`「${a.title}」について、書類には強い主導的表現がありますが、活動記録からは担当範囲を確認できません。`,ask:'実際に担当した範囲を確認してください。事実なら活動記録に追記できます。',rewrite:'確認できる役割・具体的な行動を中心に表現してください。'});}
 if(a.date){let yr=a.date.slice(0,4);let re=new RegExp('(\\d{4})年[^。\\n]{0,25}'+escapeRegExp(a.title));let m=text.match(re);if(m&&m[1]!==yr)issues.push({type:'書類との不一致',activity:a.id,title:'活動年の不一致',why:`活動記録では${yr}年ですが、文章には${m[1]}年と書かれています。`,ask:'実施年を確認してください。',rewrite:'本人確認後、正しい実施年に統一してください。'});}
 if(a.verified==='unverified')issues.push({type:'要確認',activity:a.id,title:'活動の確認状態',why:`「${a.title}」の活動記録は未確認です。`,ask:'入力した役割や成果が事実に合っているか確認してください。',rewrite:'確認できた情報だけを文章に使用してください。'});
 }}
 if(!u.activities.length)issues.push({type:'情報不足',activity:null,title:'比較する活動記録がありません',why:'活動記録が未登録のため、書類内の経験との照合ができません。',ask:'事実を記録してから再確認してください。',rewrite:'まず活動エピソードを登録しましょう。'});
 else if(!mentioned.length)issues.push({type:'情報不足',activity:null,title:'活動記録との対応が不明です',why:'登録済みの活動名が本文に一致しませんでした。活動名の言い換えや未記録の経験の可能性があります。',ask:'どの活動について書いた文章なのか確認してください。',rewrite:'必要に応じて活動名や記録を補足してください。'});
 for(let v of u.documents.filter(v=>v.type!==u.draft.type).slice(-10)){for(let a of mentioned){if(!v.text.includes(a.title))continue;let current=text.match(new RegExp('(\\d{4})年[^。\\n]{0,25}'+escapeRegExp(a.title)));let past=v.text.match(new RegExp('(\\d{4})年[^。\\n]{0,25}'+escapeRegExp(a.title)));if(current&&past&&current[1]!==past[1])issues.push({type:'書類間の不一致',activity:a.id,title:'複数書類で活動年が異なります',why:`同じ活動「${a.title}」について、別の保存書類と年が異なります。`,ask:'双方の記述を照合してください。',rewrite:'本人確認後、どちらも正確な時期を記述してください。'});}}
 return issues;}
function escapeRegExp(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}

const TRAITS=[{name:'課題解決・改善',terms:/改善|課題|工夫|検証|見直|修正|解決|工夫した/,desc:'課題を見つけ、行動を見直した経験'},{name:'協働・対話',terms:/協力|相談|話し合|意見|チーム|共同|聞い|連携|支え/,desc:'他者と連携し、意見を扱った経験'},{name:'主体性・企画',terms:/企画|提案|自ら|主体|発案|主導|率先|立案|働きかけ/,desc:'自分から働きかけた経験'},{name:'継続・振り返り',terms:/継続|毎日|続け|反省|振り返|繰り返|練習|積み重/,desc:'活動を続け、振り返った経験'},{name:'表現・発信',terms:/発表|説明|伝え|表現|演技|制作|文章|発信|プレゼン/,desc:'考えを他者に伝えた経験'}];
function analyzeStrengths(u){return TRAITS.map(t=>{let hits=u.activities.filter(a=>t.terms.test([a.role,a.action,a.result,a.learn].join(' ')));t.terms.lastIndex=0;return {name:t.name,desc:t.desc,evidence:hits.map(a=>({id:a.id,title:a.title,text:(a.action||a.learn).slice(0,125)})),count:hits.length};}).filter(x=>x.count).sort((a,b)=>b.count-a.count);}

function teacherView(){let list=school().teachers.filter(t=>t.approved&&t.status!=='closed'),u=who.role==='student'?userData():null;let query=teacherFilter;let target=u?([u.profile.topic,u.profile.university,u.draft.aim].join(' ')):'';let sorted=list.map(t=>({...t,score:teacherMatchScore(t,target+(query?' '+query:'')),homeroom:!!(who.homeroom&&who.homeroom===t.id)})).filter(t=>!query||(t.name+' '+t.subject+' '+t.keywords).toLowerCase().includes(query.toLowerCase())).sort((a,b)=>Number(b.homeroom)-Number(a.homeroom)||b.score-a.score);
 return `${heading(tx('教員検索・先生の紹介','Teacher directory'),tx('担任と志望分野に合う先生を紹介します。添削依頼は直接行ってください。','Find teachers by expertise. Document feedback requests happen face-to-face.'))}<div class="card stack"><label class="field">${tx('教員名・教科・専門分野で探す','Search by name, subject or expertise')}<input id="teacherSearch" value="${esc(query)}" placeholder="${tx('例：芸術 演劇','e.g. English')}"></label><p class="notice">${tx('推薦理由は登録済みの教員プロフィールに基づきます。実際の専門性は推測しません。','Matches use listed teacher expertise. No expertise is invented.')}</p></div><div class="grid" id="teacherCards" style="margin-top:15px">${teacherCards(sorted,u)}</div>`;}
function teacherCards(arr,u){return arr.length?arr.map(t=>`<div class="card teacher"><div class="row spread"><strong>${esc(t.name)}</strong>${t.homeroom?`<span class="tag good">${tx('担任','Homeroom')}</span>`:t.score?`<span class="tag">${tx('専門分野が関連','Relevant expertise')}</span>`:''}</div><div class="muted small">${esc(t.subject)} / ${esc(t.status==='open'?tx('相談受付中','Available for consultations'):tx('受付一時停止','Paused'))}</div><p>${esc(t.bio)}</p><p class="small">${tx('対応テーマ','Topics')}: ${esc(t.keywords)}</p>${u?`<div class="soft small">${t.homeroom?'日頃の学校生活や進路について相談できます。':t.score?'志望分野と登録専門分野に関連があります。':'教員情報を参考に、ご自身で相談先を選んでください。'}</div><div class="row"><button class="button ghost sm" data-act="teacher-intro" data-id="${esc(t.id)}">相談のお願い方を見る</button><button class="button secondary sm" data-act="request-dialog" data-id="${esc(t.id)}">相談・面接練習の申込デモ</button></div>`:''}</div>`).join(''):'<div class="empty">条件に合う先生が見つかりませんでした。</div>';}
function interviewView(){let u=userData(),p=u.profile;let questions=['その大学・学部を志望した理由を説明してください。','これまでの活動で、特に工夫したことは何ですか。','その経験から学んだことを具体例で説明してください。','大学でどのようなテーマを学びたいですか。','自分の考えと異なる意見に出会ったとき、どう対応しますか。'];if(u.activities.length){let a=u.activities.at(-1);questions.splice(1,0,`「${a.title}」でのご自身の役割と成果を説明してください。`)}return `${heading('面接対策','活動記録を参考にした想定質問です。実際の出題を予測するものではありません。')}<div class="grid"><div class="card stack"><h2>練習用質問</h2>${questions.map((q,i)=>`<div class="item"><strong>質問 ${i+1}</strong><p>${esc(q)}</p></div>`).join('')}<button class="button secondary" data-go="teachers">面接練習に適した先生を探す</button></div><div class="card stack"><h2>回答の練習ノート</h2><label class="field">回答を入力（架空の内容）<textarea id="interviewAnswer" style="min-height:170px" placeholder="自分の言葉で回答をまとめましょう">${esc(u.interviewNote||'')}</textarea></label><button class="button" data-act="save-interview">保存する</button><p class="notice">先生への練習申込は教員検索の「相談・面接練習の申込デモ」で確認できます。志望理由書のアプリ内添削依頼はできません。</p></div></div>`;}
function appView(){let u=userData();return `${heading('出願予定とタスク','大学の公式募集要項を確認し、締切日を手入力してください。')}<div class="grid"><div class="card stack"><h2>出願予定を追加</h2><form id="applicationForm" class="stack"><label class="field">大学・学部（架空名）<input id="appName" required maxlength="140" placeholder="サンプル大学 ○○学部"></label><label class="field">出願締切 <input type="date" required id="appDeadline"></label><button class="button">登録</button></form><hr class="divider"><h2>タスクを追加</h2><form id="taskForm" class="row"><input id="taskText" required maxlength="150" style="min-width:0;flex:1;padding:10px;border-radius:9px;border:1px solid #c9d5e5" placeholder="例：募集要項を読む"><button class="button">追加</button></form></div><div class="card stack"><h2>登録した出願予定</h2>${u.applications.length?u.applications.map(a=>`<div class="item"><div class="row spread"><strong>${esc(a.name)}</strong><button class="button danger sm" data-act="delete-app" data-id="${esc(a.id)}">削除</button></div><p>${esc(safeDay(a.deadline))} ／ ${dayUntil(a.deadline)}日前後（締切は公式確認が必要）</p></div>`).join(''):'<div class="empty">出願予定はありません。</div>'}<h2>準備タスク</h2>${u.tasks.length?u.tasks.map(t=>`<div class="item row spread"><label class="row"><input type="checkbox" data-act="toggle-task" data-id="${esc(t.id)}" ${t.done?'checked':''}><span ${t.done?'style="text-decoration:line-through"':''}>${esc(t.text)}</span></label><button class="button danger sm" data-act="delete-task" data-id="${esc(t.id)}">削除</button></div>`).join(''):'<div class="empty">タスクはありません。</div>'}</div></div>`;}
function historyView(){let u=userData();return `${heading('書類履歴・比較','文章の版を保存し、変更を見返せます。')}<div class="card stack"><h2>保存済みの書類</h2>${u.documents.length?u.documents.slice().reverse().map(v=>`<div class="item"><div class="row spread"><strong>${esc(v.type)}</strong><span class="small muted">${esc(new Date(v.at).toLocaleString('ja-JP'))}</span></div><p class="small muted">${esc(v.aim||'条件なし')} / ${v.text.length}文字</p><div class="boxtext">${esc(v.text.slice(0,250))}</div><div class="row" style="margin-top:9px"><button class="button secondary sm" data-act="restore-version" data-id="${esc(v.id)}">この版を編集画面へ</button><button class="button danger sm" data-act="delete-version" data-id="${esc(v.id)}">削除</button></div></div>`).join(''):'<div class="empty">書類添削画面で「版を保存」を押すと一覧に追加されます。</div>'}</div>`;}
function resourceView(){return `${heading('大学・参考文献検索','大学・研究テーマに関連する情報への検索リンクを作成します。')}<div class="grid"><div class="card stack"><h2>大学・教授・授業を調べる</h2><label class="field">大学名<input id="resUniversity" placeholder="サンプル大学"></label><label class="field">テーマ<input id="resTopic" placeholder="演劇 コミュニケーション"></label><button class="button" data-act="search-uni">検索リンクを表示</button><div id="resUniLinks"></div></div><div class="card stack"><h2>参考になる書籍・論文</h2><label class="field">テーマ<input id="resQuery" placeholder="教育 コミュニケーション"></label><div class="row"><button class="button secondary" data-act="search-book">書籍を探す</button><button class="button secondary" data-act="search-paper">論文を探す</button></div><div id="resPubLinks"></div><p class="notice">外部の公開検索サービスへ移動します。結果の信頼性や適合性、アクセス権を各自で確認してください。</p></div></div>`;}
function ideasView(){return `${heading('活動・調査の提案','自分の関心を深めるための、安全で実行可能な活動を検討します。')}<div class="card stack"><label class="field">関心のあるテーマ<input id="ideasTopic" placeholder="演劇とコミュニケーション"></label><button class="button" data-act="suggest-ideas">活動案を表示</button><div id="ideasResults"></div></div>`;}
function profileView(){let u=userData(),p=u.profile;return `${heading('受験プロフィール','架空の進路情報を保存します。ホーム画面にも反映されます。')}<div class="card"><form id="profileForm" class="stack"><label class="field">呼び名<input maxlength="35" id="pfNick" value="${esc(p.nickname)}" placeholder="生徒A（架空）"></label><label class="field">志望大学・学部<input maxlength="120" id="pfUni" value="${esc(p.university)}"></label><label class="field">入試方式<select id="pfMethod">${['総合型選抜','学校推薦型選抜','その他'].map(m=>`<option ${p.method===m?'selected':''}>${m}</option>`).join('')}</select></label><label class="field">研究・関心テーマ<input maxlength="250" id="pfTopic" value="${esc(p.topic)}"></label><label class="field">出願締切（公式情報を確認）<input type="date" id="pfDeadline" value="${esc(p.deadline)}"></label><button class="button">保存</button></form></div>`;}
function settingsView(){let u=who.role==='student'?userData():null;return `${heading(tx('設定・データ管理','Settings and data'),tx('試作版の表示設定とデータの管理を行います。','Manage demo preferences and local data.'))}<div class="card stack">${u?`<div class="row spread"><div><strong>進路ダッシュボード</strong><p class="notice" style="margin:0">ホームの上部に表示します。オフにしても基本機能は残ります。</p></div><label class="row"><input id="dashboardToggle" type="checkbox" ${u.settings.dashboard!==false?'checked':''}> 表示する</label></div><hr class="divider">`:''}<label class="field">${tx('表示言語','Display language')}<select id="settingsLang"><option value="ja" ${lang==='ja'?'selected':''}>日本語</option><option value="en" ${lang==='en'?'selected':''}>English</option></select></label><div class="row"><button class="button secondary" data-act="export-data">${tx('自分のデータをJSON出力','Export my demo data as JSON')}</button>${u?'<label class="button ghost" style="cursor:pointer">JSONを読み込む<input style="display:none" id="importData" type="file" accept=".json,application/json"></label>':''}</div><div class="warning">${tx('同じ端末のブラウザ保存は他人からの閲覧を防ぐ仕組みではありません。学校導入にはサーバー認証・権限制御・安全な保存・監査ログが必要です。','Browser-only storage is not a security boundary. Production needs server authentication, authorization, secure storage and audit logs.')}</div><button class="button danger" data-act="clear-user">${tx('自分のデモデータを初期化','Clear my demo data')}</button></div>`;}
function teacherPortalView(){let t=school().teachers.find(t=>t.id===who.teacherId),requests=school().requests.filter(r=>r.teacherId===who.teacherId);if(!t)return '<div class="error">教員プロフィールがありません。</div>';return `${heading(tx('先生マイページ','Teacher portal'),tx('教員情報と相談・面接練習申込を管理します。','Manage teacher profile and appointment requests.'))}
 <div class="grid"><div class="card stack"><h2>${tx('プロフィール編集','Edit profile')}</h2><form id="teacherForm" class="stack"><label class="field">${tx('表示名','Display name')}<input id="tName" required value="${esc(t.name)}" maxlength="60"></label><label class="field">${tx('担当教科','Subject')}<input id="tSubject" value="${esc(t.subject)}" required maxlength="100"></label><label class="field">${tx('専門分野（空白区切り）','Areas of expertise')}<textarea required id="tKeywords" maxlength="500">${esc(t.keywords)}</textarea></label><label class="field">${tx('自己紹介','Profile description')}<textarea id="tBio" maxlength="500">${esc(t.bio)}</textarea></label><label class="field">${tx('受付状況','Availability status')}<select id="tStatus"><option value="open" ${t.status==='open'?'selected':''}>${tx('受付中','Open')}</option><option value="paused" ${t.status==='paused'?'selected':''}>${tx('一時停止','Paused')}</option><option value="closed" ${t.status==='closed'?'selected':''}>${tx('受付終了','Closed')}</option></select></label><button class="button">${tx('変更を申請','Submit update')}</button><p class="notice">${tx('プロフィール編集後は管理者が確認するまで教員検索に表示されません。','Profile changes require admin approval before appearing in teacher search.')}</p></form></div>
 <div class="card stack"><h2>${tx('相談・面接練習の申し込み','Consultation and interview requests')}</h2><p class="notice">${tx('これは同じブラウザ内でのデモです。先生に実際の通知は送信されません。','These requests are local to this browser. No real notifications are sent.')}</p>${requests.length?requests.map(r=>`<div class="item"><div class="row spread"><strong>${esc(r.studentLabel)} / ${esc(r.kind)}</strong><span class="tag ${r.status==='approved'?'good':r.status==='declined'?'danger':'warn'}">${esc(r.status)}</span></div><p>${esc(r.comment||tx('連絡事項なし','No note'))}</p><p class="small muted">${esc(r.date||tx('希望日なし','No preferred date'))}</p><div class="row"><button class="button secondary sm" data-act="request-status" data-id="${esc(r.id)}" data-status="approved">${tx('承認','Approve')}</button><button class="button ghost sm" data-act="request-status" data-id="${esc(r.id)}" data-status="declined">${tx('辞退','Decline')}</button></div></div>`).join(''):'<div class="empty">'+tx('申し込みはありません。','No requests yet.')+'</div>'}</div></div>`;}
function adminView(){let s=school(),unapproved=s.teachers.filter(t=>!t.approved);return `${heading(tx('管理者ページ','Administration'),tx('学校単位でデモデータを分けています。','Demo school data is separated by school.'))}<div class="grid"><div class="card stack"><h2>${tx('教員プロフィール承認','Teacher profile approvals')}</h2>${unapproved.length?unapproved.map(t=>`<div class="item"><strong>${esc(t.name)}</strong><p>${esc(t.subject)} / ${esc(t.keywords)}</p><button class="button secondary sm" data-act="approve-teacher" data-id="${esc(t.id)}">${tx('承認','Approve')}</button></div>`).join(''):'<div class="empty">'+tx('承認待ちはありません。','No pending approvals.')+'</div>'}<h2>${tx('教員一覧','Staff')}</h2>${s.teachers.map(t=>`<div class="small">${esc(t.name)} / ${esc(t.subject)} / ${esc(t.status)} ${t.approved?'':'（未承認）'}</div>`).join('')}</div><div class="card stack"><h2>${tx('予約・運用サマリー','Requests and operations')}</h2><span class="tag">${s.requests.length} ${tx('件','requests')}</span>${s.requests.map(r=>`<div class="item small">${esc(r.studentLabel)} → ${esc(s.teachers.find(t=>t.id===r.teacherId)?.name||'--')} / ${esc(r.kind)} / ${esc(r.status)}</div>`).join('')||'<p class="notice">申し込みはありません。</p>'}<div class="warning">${tx('操作権限は画面上のデモであり、実際の管理者認証ではありません。','These are simulated privileges, not secure administrator authorization.')}</div></div></div>`;}
function view(){if(!who)return '';if(page==='home')return who.role==='student'?studentHome():who.role==='teacher'?teacherHome():adminHome();
 if(page==='teachers')return teacherView();if(page==='settings')return settingsView();if(who.role==='teacher')return teacherPortalView();if(who.role==='admin')return adminView();
 return ({journal:activityView,documents:docView,factcheck:factView,selfanalysis:selfView,interview:interviewView,applications:appView,history:historyView,resources:resourceView,activities:ideasView,profile:profileView})[page]?.()||studentHome();}
function changePage(next){if(!navItems().some(a=>a[0]===next))return;page=next;currentNotice='';if(next==='documents'){lastChecks=userData().lastChecks||[];}render();window.scrollTo({top:0,behavior:'instant'});}
function login(id,password){let a=ACCOUNTS.find(x=>x.id===id&&x.pass===password);if(!a)return false;who=a;page='home';editActivityId=null;lastChecks=[];teacherFilter='';currentNotice='';if(a.role==='student')userData();render();return true;}
function signOut(){who=null;page='home';editActivityId=null;render();}
function dlFile(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function docDraftFromDom(){const u=userData();u.draft={type:$('docType')?.value||u.draft.type,aim:$('docAim')?.value||'',text:$('docText')?.value||''};persist();}
function setLanguage(v){lang=v==='en'?'en':'ja';gate=true;try{localStorage.setItem(LANGKEY,lang);}catch{}render();}
function act(a,node){let u=who?.role==='student'?userData():null,id=node.dataset.id;
 if(a==='lang-pick'){setLanguage(node.dataset.lang);return;}
 if(a==='fill-login'){let account=ACCOUNTS.find(x=>x.id===id);if(account){$('loginId').value=account.id;$('loginPass').value=account.pass;}return;}
 if(a==='logout'){signOut();return;}
 if(a==='toggle-compact'){u.settings.compact=!u.settings.compact;persist();render();return;}
 if(a==='edit-activity'){editActivityId=id;changePage('journal');return;}
 if(a==='cancel-activity'){editActivityId=null;render();return;}
 if(a==='delete-activity'){if(!confirm('この活動記録を削除しますか？'))return;u.activities=u.activities.filter(x=>x.id!==id);editActivityId=null;u.analysis=null;persist();notify('活動記録を削除しました。');return;}
 if(a==='run-analysis'){u.analysis={at:new Date().toISOString(),strengths:analyzeStrengths(u)};persist();notify('活動記録から強みの候補を整理しました。');return;}
 if(a==='save-version'){docDraftFromDom();if(!u.draft.text.trim())return alert('文章を入力してください。');u.documents.push({...u.draft,id:uid(),at:new Date().toISOString()});persist();notify('書類の版を保存しました。');return;}
 if(a==='run-facts'){u.lastChecks=factChecks(u.draft.text,u).map(x=>({...x,review:'open'}));lastChecks=u.lastChecks;persist();notify('活動記録との照合を行いました。');return;}
 if(a==='review-fact'){let i=Number(node.dataset.idx);if(u.lastChecks[i]){u.lastChecks[i].review=node.dataset.value;persist();render();}return;}
 if(a==='teacher-intro'){let t=school().teachers.find(x=>x.id===id);if(t)alert(`【先生への相談例】\n${t.name}へ\n「進路についてご相談したいことがあります。直接お時間をいただくことはできますか？」\n\n書類は生徒自身が直接持参してください。アプリ内送信はありません。`);return;}
 if(a==='request-dialog'){let t=school().teachers.find(x=>x.id===id);if(!t)return;const kind=prompt('相談・面接練習のどちらですか？（「相談」または「面接練習」と入力）','面接練習');if(!kind)return;if(!['相談','面接練習'].includes(kind.trim()))return alert('「相談」または「面接練習」を入力してください。');let date=prompt('希望日（任意、例：2026-11-12）','')||'';school().requests.push({id:uid(),studentId:who.id,studentLabel:who.name,teacherId:id,kind:kind.trim(),date:date.slice(0,30),comment:'',status:'pending'});persist();notify('同じ端末内のデモ予約を登録しました。実際の通知は送信されません。');return;}
 if(a==='request-status'){let r=school().requests.find(x=>x.id===id&&x.teacherId===who.teacherId);if(r){r.status=node.dataset.status;persist();notify(tx('申し込み状況を更新しました（デモ）。','Request status updated (demo).'));}return;}
 if(a==='approve-teacher'){let t=school().teachers.find(x=>x.id===id);if(t){t.approved=true;persist();notify(tx('承認しました。','Approved.'));}return;}
 if(a==='save-interview'){u.interviewNote=$('interviewAnswer').value.slice(0,10000);persist();notify('面接練習ノートを保存しました。');return;}
 if(a==='delete-app'){u.applications=u.applications.filter(x=>x.id!==id);persist();render();return;}
 if(a==='delete-task'){u.tasks=u.tasks.filter(x=>x.id!==id);persist();render();return;}
 if(a==='toggle-task'){let t=u.tasks.find(x=>x.id===id);if(t){t.done=node.checked;persist();render();}return;}
 if(a==='delete-version'){if(!confirm('この書類の版を削除しますか？'))return;u.documents=u.documents.filter(x=>x.id!==id);persist();render();return;}
 if(a==='restore-version'){let v=u.documents.find(x=>x.id===id);if(v){u.draft={type:v.type,aim:v.aim,text:v.text};persist();changePage('documents');}return;}
 if(a==='search-uni'){let n=$('resUniversity').value.trim(),t=$('resTopic').value.trim();if(!n)return alert('大学名を入力してください。');let q=encodeURIComponent(n+' '+t),qs=[['大学公式情報',n+' 公式 学部'],['教員・研究室',n+' 教員 '+t],['講義・シラバス',n+' シラバス '+t]];$('resUniLinks').innerHTML=qs.map(([label,s])=>`<div class="item"><a target="_blank" rel="noopener noreferrer" href="https://www.google.com/search?q=${encodeURIComponent(s)}">${esc(label)}</a></div>`).join('');return;}
 if(a==='search-book'||a==='search-paper'){let q=$('resQuery').value.trim();if(!q)return alert('テーマを入力してください。');let url=a==='search-book'?'https://openlibrary.org/search?q='+encodeURIComponent(q):'https://search.crossref.org/?q='+encodeURIComponent(q);$('resPubLinks').innerHTML=`<div class="item"><a href="${url}" rel="noopener noreferrer" target="_blank">${a==='search-book'?'Open Libraryで書籍を検索':'Crossrefで論文を検索'}</a></div>`;return;}
 if(a==='suggest-ideas'){let t=$('ideasTopic').value.trim();if(!t)return alert('テーマを入力してください。');$('ideasResults').innerHTML=`<div class="list"><div class="item"><strong>文献調査</strong><p>「${esc(t)}」の基本的な研究・書籍を調べ、出典を記録しましょう。</p></div><div class="item"><strong>教員への相談</strong><p>校内で関連分野を担当する先生に、研究の進め方を相談しましょう。</p></div><div class="item"><strong>許可を得た調査計画</strong><p>学校の規則と参加者の同意を前提に、簡単な質問項目と実施計画を作りましょう。</p></div></div>`;return;}
 if(a==='export-data'){let content=u?{format:'compass-demo-student-v7',school:who.school,user:who.id,data:u}:{format:'compass-demo-school-v7',school:who.school,data:school()};dlFile('compass_demo_'+who.id+'.json',JSON.stringify(content,null,2),'application/json');return;}
 if(a==='clear-user'){if(!confirm('このアカウントのデモデータを初期化しますか？'))return;if(u)db.users[who.id]=newUser();else{alert('教員・管理者データはこの画面から初期化できません。');return;}persist();notify('このアカウントのデモデータを初期化しました。');return;}
}
document.addEventListener('click',e=>{let n=e.target.closest('[data-go]');if(n){e.preventDefault();changePage(n.dataset.go);return;}n=e.target.closest('[data-act]');if(n){e.preventDefault();act(n.dataset.act,n);}});
document.addEventListener('submit',e=>{const f=e.target;if(!f.id)return;e.preventDefault();
 if(f.id==='loginForm'){if(!login($('loginId').value.trim(),$('loginPass').value)){$('loginError').classList.remove('hidden');$('loginError').textContent=lang==='en'?'Invalid demo account or password.':'デモIDまたはパスワードが違います。';}return;}
 if(!who)return;let u=who.role==='student'?userData():null;
 if(f.id==='activityForm'){let a={id:editActivityId||uid(),title:$('aTitle').value.trim(),date:$('aDate').value,role:$('aRole').value.trim(),action:$('aAction').value.trim(),result:$('aResult').value.trim(),learn:$('aLearn').value.trim(),verified:$('aVerify').value,evidence:$('aEvidence').value.trim()};if(a.verified==='evidence'&&!a.evidence.trim())return alert('「資料による裏付けあり」を選ぶ場合は資料のメモを入力してください。');let idx=u.activities.findIndex(x=>x.id===a.id);if(idx>=0)u.activities[idx]=a;else u.activities.push(a);editActivityId=null;u.analysis=null;persist();notify('活動エピソードを保存しました。');return;}
 if(f.id==='docForm'){docDraftFromDom();if(!u.draft.text.trim())return alert('文章を入力してください。');let type=u.draft.type;u.runs[type]=(u.runs[type]||0)+1;u.lastChecks=factChecks(u.draft.text,u).map(x=>({...x,review:'open'}));lastChecks=u.lastChecks;persist();notify('簡易添削と事実確認を行いました。');return;}
 if(f.id==='applicationForm'){u.applications.push({id:uid(),name:$('appName').value.trim(),deadline:$('appDeadline').value});persist();notify('出願予定を保存しました。');return;}
 if(f.id==='taskForm'){u.tasks.push({id:uid(),text:$('taskText').value.trim(),done:false});persist();notify('タスクを追加しました。');return;}
 if(f.id==='profileForm'){u.profile={nickname:$('pfNick').value.trim(),university:$('pfUni').value.trim(),method:$('pfMethod').value,topic:$('pfTopic').value.trim(),deadline:$('pfDeadline').value};persist();notify('デモプロフィールを保存しました。');return;}
 if(f.id==='teacherForm'){let t=school().teachers.find(x=>x.id===who.teacherId);if(!t)return;t.name=$('tName').value.trim();t.subject=$('tSubject').value.trim();t.keywords=$('tKeywords').value.trim();t.bio=$('tBio').value.trim();t.status=$('tStatus').value;t.approved=false;persist();notify(tx('教員情報の変更を申請しました。管理者の承認待ちです。','Teacher profile updated. Admin approval is required.'));return;}
});
document.addEventListener('change',e=>{let id=e.target.id;if(['appLang','loginLang','settingsLang'].includes(id)){setLanguage(e.target.value);return;}if(id==='dashboardToggle'&&who.role==='student'){userData().settings.dashboard=e.target.checked;persist();render();return;}if(id==='importData'&&e.target.files?.[0]){let file=e.target.files[0];if(file.size>2_000_000){alert('2MB以下のJSONのみ読み込めます。');return;}file.text().then(text=>{try{let o=JSON.parse(text);if(o.format!=='compass-demo-student-v7'||!o.data||!Array.isArray(o.data.activities)||!Array.isArray(o.data.documents)||!Array.isArray(o.data.tasks))throw Error('format');if(!confirm('現在のアカウントのデモデータを上書きしますか？'))return;let fresh=newUser(),d=o.data;fresh.profile={...fresh.profile,...d.profile};fresh.activities=d.activities.slice(0,150).map(a=>({id:uid(),title:String(a.title||'').slice(0,120),date:String(a.date||'').slice(0,10),role:String(a.role||'').slice(0,250),action:String(a.action||'').slice(0,1400),result:String(a.result||'').slice(0,1200),learn:String(a.learn||'').slice(0,1200),verified:['self','evidence'].includes(a.verified)?a.verified:'unverified',evidence:String(a.evidence||'').slice(0,300)}));fresh.documents=d.documents.slice(0,80).map(a=>({id:uid(),type:String(a.type||'志望理由書').slice(0,30),aim:String(a.aim||'').slice(0,200),text:String(a.text||'').slice(0,12000),at:new Date().toISOString()}));fresh.tasks=d.tasks.slice(0,120).map(a=>({id:uid(),text:String(a.text||'').slice(0,150),done:!!a.done}));fresh.settings={dashboard:d.settings?.dashboard!==false,compact:!!d.settings?.compact};db.users[who.id]=fresh;persist();notify('JSONからデモデータを取り込みました。');}catch(err){alert('対応したJSON形式ではありません。');}});return;}});
document.addEventListener('input',e=>{if(!who||who.role!=='student')return;if(e.target.id==='docText'||e.target.id==='docAim'||e.target.id==='docType'){docDraftFromDom();if($('textLen'))$('textLen').textContent=$('docText').value.length+'文字';}if(e.target.id==='teacherSearch'){teacherFilter=e.target.value;let u=userData(),target=[u.profile.topic,u.profile.university,u.draft.aim].join(' ');let arr=school().teachers.filter(t=>t.approved&&t.status!=='closed').map(t=>({...t,score:teacherMatchScore(t,target+' '+teacherFilter),homeroom:who.homeroom===t.id})).filter(t=>(t.name+' '+t.subject+' '+t.keywords).toLowerCase().includes(teacherFilter.toLowerCase())).sort((a,b)=>Number(b.homeroom)-Number(a.homeroom)||b.score-a.score);$('teacherCards').innerHTML=teacherCards(arr,u);}});
render();
</script>
</body>
</html>
